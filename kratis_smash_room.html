<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Krati's Smash Room 🔨💗</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7eaf7;font-family:system-ui,sans-serif}#game{max-width:560px;height:100dvh;min-height:580px;max-height:850px;margin:auto;position:relative;overflow:hidden;background:linear-gradient(180deg,#fff0f8,#edddff 70%,#d5b8f1);color:#67396e;touch-action:manipulation;user-select:none;isolation:isolate}.target{position:absolute;width:83px;height:88px;border:2px solid #fff9;border-radius:22px;background:#fff9;box-shadow:0 6px 14px #9e6c9b35;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;animation:bob 1.3s ease-in-out infinite alternate;touch-action:manipulation;color:#67396e;padding:0;font-family:inherit}.emoji{font-size:37px;line-height:1.1}.lbl{font-size:10px;font-weight:750;text-align:center;line-height:1.15;padding:0 3px}.btn{border:0;border-radius:30px;background:#e85b9d;color:white;font-weight:800;padding:13px 27px;box-shadow:0 5px 0 #b84279;cursor:pointer;font-family:inherit}.fx{position:absolute;font-size:24px;font-weight:1000;color:#d33988;text-shadow:2px 2px white;pointer-events:none;animation:fx .75s ease-out forwards;z-index:12}.spark{position:absolute;pointer-events:none;animation:fly .7s ease-out forwards;z-index:11}.hammer{position:absolute;pointer-events:none;width:100px;height:110px;z-index:20;animation:hammer .35s ease-out forwards}.hammer.super{width:160px;height:175px;filter:drop-shadow(0 0 12px #ffcf52)}.rex-boss{width:215px;height:242px;border:4px solid white;background:linear-gradient(145deg,#f5d9ff,#d6a5fa);border-radius:35px;box-shadow:0 10px 30px #8e51b050;animation:bossbob .8s ease-in-out infinite alternate}.thought{position:absolute;z-index:3;pointer-events:none;font-size:12px;font-weight:900;color:#8940a3;background:#fff9;border:2px solid #e2b7f1;border-radius:18px;padding:7px 10px;animation:thought 1.7s ease-in-out infinite alternate}.toast{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:max-content;max-width:92%;z-index:28;background:#fff9;border:2px solid #f7b6d6;border-radius:18px;padding:9px 15px;text-align:center;font-size:12px;font-weight:900;color:#973f86;box-shadow:0 6px 20px #95538935;pointer-events:none;animation:toast 2.3s ease forwards}.confetti{position:absolute;top:-30px;pointer-events:none;z-index:35;animation:fall var(--dur) linear forwards}.power-pill{position:absolute;z-index:13;top:5px;left:50%;transform:translateX(-50%);padding:7px 13px;border-radius:20px;background:#ffdc71;color:#823a67;font-size:12px;font-weight:1000;box-shadow:0 3px 10px #c9875580;white-space:nowrap}.badge-pill{display:inline-block;margin:3px;padding:5px 9px;border-radius:20px;background:#f9d9ee;border:1px solid #e9a9d4;font-size:11px;font-weight:800;color:#863e79}.reaction{position:absolute;z-index:16;pointer-events:none;width:184px;text-align:center;animation:reaction 1.3s ease-out forwards}.reaction-face{font-size:38px;display:block;animation:wiggle .2s ease-in-out 5 alternate;filter:drop-shadow(0 3px 3px #9e6c9b50)}.reaction-text{display:block;font-size:12px;font-weight:900;line-height:1.35;background:#fffdfb;border:2px solid #f3a6d1;color:#7b3c77;padding:7px 9px;border-radius:14px;box-shadow:0 4px 12px #9e6c9b40}.impact-ring{position:absolute;border:4px solid #ff91cb;border-radius:50%;width:25px;height:25px;pointer-events:none;z-index:10;animation:ring .5s ease-out forwards}.sleep-rex{font-size:12px;font-weight:800;color:#865399;text-align:center;margin:-6px 0 13px;animation:sleep 2.5s ease-in-out infinite}.sleep-emoji{display:block;font-size:32px}.sleep-bubble{display:inline-block;background:#fff;border:1px solid #e9c4ed;padding:5px 10px;border-radius:14px;margin-top:3px}.dizzy{animation:dizzy .4s ease-in-out infinite alternate!important}.shake{animation:shake .22s linear!important}@keyframes bob{to{transform:translateY(-8px) rotate(3deg)}}@keyframes bossbob{to{transform:translate(-50%,-53%) rotate(2deg)}}@keyframes thought{to{translate:0 -9px}}@keyframes fx{to{opacity:0;transform:translateY(-60px) scale(1.35)}}@keyframes fly{to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(120deg)}}@keyframes hammer{0%{transform:translate(-5px,-50px) rotate(-65deg) scale(1.2)}55%{transform:translate(-15px,-35px) rotate(15deg)}100%{opacity:0;transform:translate(-15px,-35px) rotate(20deg)}}@keyframes defeat{to{opacity:0;transform:translate(-50%,-50%) rotate(540deg) scale(.05)}}@keyframes toast{0%{opacity:0;translate:0 -15px}15%,75%{opacity:1;translate:0 0}100%{opacity:0;translate:0 -12px}}@keyframes fall{to{transform:translate(var(--drift),100vh) rotate(var(--spin));opacity:.2}}@keyframes reaction{0%{opacity:0;transform:translateY(12px) scale(.6)}15%,75%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-36px) scale(.95)}}@keyframes wiggle{to{transform:rotate(15deg) scale(1.1)}}@keyframes ring{to{opacity:0;transform:translate(-50%,-50%) scale(5)}}@keyframes sleep{50%{transform:translateY(-5px)}}@keyframes dizzy{to{filter:hue-rotate(25deg);rotate:5deg;scale:1.06}}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
</style></head><body><div id="game"><div style="position:absolute;inset:0;pointer-events:none;opacity:.55;background:radial-gradient(circle at 12% 22%,white 0 2px,transparent 3px),radial-gradient(circle at 78% 38%,white 0 3px,transparent 4px);background-size:90px 110px"></div><div style="position:relative;z-index:10;text-align:center;padding:20px 12px 0"><div style="font-size:25px;font-weight:900;color:#a63f86">🔨 Krati's Smash Room 💗</div><div style="font-size:12px;margin-top:3px;color:#8a5c90">No explanations. No drama. Just BONK!</div><div style="display:flex;justify-content:space-between;align-items:center;margin:16px 12px 0;border-radius:16px;padding:12px 17px;background:#ffffffb8"><div style="text-align:left"><div style="font-size:10px;opacity:.65">SMASHED</div><div id="score" style="font-size:22px;font-weight:900">0</div></div><div style="text-align:center"><div style="font-size:10px;opacity:.65">COMBO</div><div id="combo" style="font-size:22px;font-weight:900">0×</div></div><div style="text-align:right"><div style="font-size:10px;opacity:.65">TIME</div><div id="time" style="font-size:22px;font-weight:900">60s</div></div></div></div><div id="field" style="position:absolute;left:8px;right:8px;top:155px;bottom:65px;overflow:hidden;border-radius:20px;background:radial-gradient(ellipse at 50% 90%,#fff8 0%,transparent 65%)"></div><div id="overlay" style="position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;background:#fff2f7ee;color:#71345f"><div id="hero" style="font-size:78px">🔨</div><div id="title" style="font-size:29px;font-weight:900;color:#a63f86;margin:14px 0">Ready, Krati?</div><p id="message" style="font-size:15px;line-height:1.7;max-width:310px;margin:0 0 25px;color:#71345f">Aaj kisi ko explanation nahi dena.<br>Bas SMASH karna hai! 😤💗</p><div id="badges" style="display:none;max-width:340px;margin:-12px 0 18px;text-align:center"></div><div id="sleep" class="sleep-rex" style="display:none"><span class="sleep-emoji">☁️🦖💤</span><span class="sleep-bubble">No more what-ifs today... zzz.</span></div><button id="start" class="btn">LET'S SMASH! 💥</button></div><div style="position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:12px;font-weight:800;color:#986a9d">✨ Stress goes out. Sparkles come in. ✨</div></div>
<script>
(()=>{const root=document.getElementById('game'),field=document.getElementById('field'),overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),timeEl=document.getElementById('time'),start=document.getElementById('start'),badgeBox=document.getElementById('badges'),sleepBox=document.getElementById('sleep');
const items=[['👩🏽‍🦱','Mannu Bua'],['👦🏻','Ritik'],['👩🏻‍🦰','Choti Bua'],['🫏','Gadha Pandit'],['🧔🏻','Piyush'],['🧑🏻','Ronit'],['⏰','Unwanted alarms'],['📱','Annoying calls'],['💭','Overthinking'],['📋','Expectations'],['🙄','Unwanted advice'],['😤','Drama'],['🗣️','Nosy people'],['❓','Endless questions'],['🧔🏻','Piyush']];
const apologies=['Sorryyy Kratiii! 🥺','Main kaan pakadta hoon! 🙉','Sorry sorry sorry, ab nahi karunga! 🥹'];let score=0,combo=0,time=60,running=false,boss=false,bossHits=0,tick=null,spawn=null,ctx=null,lastHit=0,superUntil=0,superUsed=false,piyushHits=0,buaHits=0,achievements=new Set(),bossDefeated=false,finalTimer=null,lastApology=-1;const comboTitles={3:'Bonk Beginner 🔨',5:'Drama Destroyer 💥',10:'Queen of Dhishoom 👑',15:'Krati the Unstoppable 🔥'};
function sound(freq=230){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(freq,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(90,ctx.currentTime+.13);g.gain.setValueAtTime(.11,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.16);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.17)}catch(e){}}
function toast(msg){const old=field.querySelector('.toast');if(old)old.remove();const d=document.createElement('div');d.className='toast';d.textContent=msg;field.appendChild(d);setTimeout(()=>d.remove(),2300)}function award(id,label){if(achievements.has(id))return;achievements.add(id);toast('🏆 ACHIEVEMENT: '+label);sound(530)}function superActive(){return Date.now()<superUntil}
function impact(x,y,powered){const ring=document.createElement('div');ring.className='impact-ring';ring.style.left=x+'px';ring.style.top=y+'px';ring.style.transform='translate(-50%,-50%)';ring.style.borderColor=powered?'#ffd35b':'#ff91cb';field.appendChild(ring);setTimeout(()=>ring.remove(),530);if(powered){field.classList.remove('shake');void field.offsetWidth;field.classList.add('shake');setTimeout(()=>field.classList.remove('shake'),240)}}
function effects(x,y){const powered=superActive();impact(x,y,powered);const h=document.createElement('div');h.className='hammer'+(powered?' super':'');h.style.left=x+'px';h.style.top=y+'px';h.innerHTML='<svg viewBox="0 0 120 130"><g transform="rotate(-35 65 65)"><rect x="57" y="47" width="15" height="79" rx="7" fill="#f9a45f" stroke="#a34c70" stroke-width="3"/><rect x="18" y="13" width="94" height="55" rx="23" fill="'+(powered?'#ffc447':'#fa67a8')+'" stroke="#a73c78" stroke-width="4"/><rect x="24" y="17" width="81" height="16" rx="9" fill="#fff4cf" opacity=".9"/><text x="57" y="58" font-size="23" text-anchor="middle">💗</text></g></svg>';field.appendChild(h);setTimeout(()=>h.remove(),370);const f=document.createElement('div');f.className='fx';f.textContent=powered?'MEGA BONK! 💥':['BONK!','POW!','DHISHOOM!','BAM!','BYE!'][Math.floor(Math.random()*5)];f.style.left=Math.max(5,x-40)+'px';f.style.top=(y-30)+'px';field.appendChild(f);setTimeout(()=>f.remove(),800);for(let i=0;i<(powered?22:13);i++){const p=document.createElement('div');p.className='spark';p.textContent=['💗','✨','⭐','🌸','💥'][i%5];p.style.left=x+'px';p.style.top=y+'px';p.style.setProperty('--dx',(Math.random()*(powered?260:180)-(powered?130:90))+'px');p.style.setProperty('--dy',(Math.random()*(powered?240:160)-(powered?140:100))+'px');field.appendChild(p);setTimeout(()=>p.remove(),750)}}
function stats(){scoreEl.textContent=score;comboEl.textContent=combo+'×';timeEl.textContent=time+'s'}function maybeSuper(){if(combo===10&&!superUsed){superUsed=true;superUntil=Date.now()+5000;const pill=document.createElement('div');pill.className='power-pill';pill.textContent='🔨 SUPER HAMMER! 5 SECONDS 🔥';field.appendChild(pill);toast('🔥 SUPER HAMMER ACTIVATED!');setTimeout(()=>pill.remove(),5000);award('hammer','Super Hammer Unlocked')}}function nextApology(){let i=Math.floor(Math.random()*(apologies.length-1));if(i>=lastApology)i++;lastApology=i;return apologies[i]}
function piyushReaction(x,y,line){const d=document.createElement('div');d.className='reaction';d.style.left=Math.max(0,Math.min(field.clientWidth-188,x-90))+'px';d.style.top=Math.max(5,y-115)+'px';const face=document.createElement('span');face.className='reaction-face';face.textContent=line.includes('kaan pakadta')?'🙉':line.includes('ab nahi')?'😭':'🥹';const text=document.createElement('span');text.className='reaction-text';text.textContent=line;d.append(face,text);field.appendChild(d);setTimeout(()=>d.remove(),1350)}
function hit(el,label){if(!running||boss||el.dataset.hit)return;el.dataset.hit='1';const x=el.offsetLeft+el.offsetWidth/2,y=el.offsetTop+el.offsetHeight/2;effects(x,y);sound(240+Math.random()*120);el.style.pointerEvents='none';el.style.animation='none';el.style.transform='scale(.6) rotate(-14deg)';el.style.opacity='0';setTimeout(()=>el.remove(),100);score++;combo=Date.now()-lastHit<2000?combo+1:1;lastHit=Date.now();stats();if(label==='Piyush'){piyushHits++;piyushReaction(x,y,nextApology());if(piyushHits===3)award('piyush','Piyush Punisher 😂')}if(label==='Mannu Bua'||label==='Choti Bua'){buaHits++;if(buaHits===5)award('bua','Bua Buster 💥')}if(comboTitles[combo])toast('👑 '+comboTitles[combo]);if(combo===5)award('combo5','Drama Destroyer');if(combo===15)award('combo15','Krati the Unstoppable');maybeSuper()}
function spawnTarget(){if(!running||boss||field.querySelectorAll('.target').length>=7)return;const item=items[Math.floor(Math.random()*items.length)];const b=document.createElement('button');b.className='target';b.innerHTML='<span class="emoji">'+item[0]+'</span><span class="lbl">'+item[1]+'</span>';const w=Math.max(1,field.clientWidth-90),h=Math.max(1,field.clientHeight-94);b.style.left=(5+Math.random()*w)+'px';b.style.top=(4+Math.random()*h)+'px';field.appendChild(b);b.addEventListener('click',()=>hit(b,item[1]));setTimeout(()=>{if(b.isConnected&&!boss)b.remove()},4200)}
function showBoss(){boss=true;superUntil=0;field.innerHTML='';const title=document.createElement('div');title.style.cssText='position:absolute;top:5%;width:100%;text-align:center;font-size:21px;font-weight:1000;color:#a63f86';title.textContent='🦖 FINAL BOSS!';field.appendChild(title);const b=document.createElement('button');b.className='target rex-boss';b.style.cssText+=';left:50%;top:52%;transform:translate(-50%,-50%);animation:bossbob .8s ease-in-out infinite alternate';b.innerHTML='<div id="crown" style="font-size:16px">👑 ❓❓</div><div id="rexface" style="font-size:83px;line-height:1">🦖</div><div style="font-size:14px;font-weight:1000;line-height:1.2">OVERTHINKINGASAURUS<br>REX</div><div id="hp" style="font-size:14px">💗💗💗💗💗💗💗💗</div>';field.appendChild(b);const bubble=document.createElement('div');bubble.className='thought';bubble.style.cssText='top:14%;right:4%';bubble.textContent='But what if...?';field.appendChild(bubble);const thoughts=['But what if...?','Are you sure?','What about tomorrow?','47 possible scenarios!','Wait, one more thought!','What did that mean?','Let me rethink this...','Oh no, another what if!'];b.addEventListener('click',()=>{if(!running||bossDefeated)return;bossHits++;score++;stats();sound(170);effects(field.clientWidth/2,field.clientHeight*.48);b.querySelector('#hp').textContent='💗'.repeat(Math.max(0,8-bossHits));bubble.textContent=thoughts[Math.min(bossHits,7)];const crown=b.querySelector('#crown'),face=b.querySelector('#rexface');if(bossHits>=6){crown.textContent='💫 😵‍💫 💫';face.classList.add('dizzy');bubble.style.background='#ffe6f5'}else if(bossHits>=4){crown.textContent='⭐ 😵 ⭐';face.classList.add('dizzy')}else if(bossHits>=2){crown.textContent='😵 ❓ 💫'}if(bossHits>=8){bossDefeated=true;award('rex','Overthinking Slayer 🦖');bubble.textContent='Okay okay! No more what-ifs! 😭';bubble.style.zIndex='25';b.style.animation='defeat .65s ease-in forwards';finalTimer=setTimeout(end,1050)}})}
function confetti(){const colors=['#ed69a6','#f8c65b','#a87ee9','#fff','#8bd9d3'];for(let i=0;i<75;i++){const p=document.createElement('div');p.className='confetti';p.style.left=Math.random()*100+'%';p.style.width=(5+Math.random()*7)+'px';p.style.height=(8+Math.random()*10)+'px';p.style.background=colors[i%colors.length];p.style.borderRadius=i%3===0?'50%':'2px';p.style.animationDelay=Math.random()*1.8+'s';p.style.setProperty('--dur',(2.5+Math.random()*2.3)+'s');p.style.setProperty('--drift',(Math.random()*170-85)+'px');p.style.setProperty('--spin',(Math.random()*1080-540)+'deg');root.appendChild(p);setTimeout(()=>p.remove(),6500)}}
function end(){if(!running)return;running=false;clearInterval(tick);clearInterval(spawn);clearTimeout(finalTimer);field.innerHTML='';overlay.style.display='flex';document.getElementById('hero').textContent='🏆';document.getElementById('title').textContent='Drama Defeated! 🏆';document.getElementById('message').style.color='#71345f';document.getElementById('message').innerHTML='Krati smashed <b>'+score+'</b> annoying things! 🎉<br><br>99% unnecessary drama defeated.<br>The remaining 1% can wait until tomorrow. 💗';start.textContent='SMASH AGAIN 🔨';badgeBox.innerHTML='';if(achievements.size){badgeBox.style.display='block';const cap=document.createElement('div');cap.style.cssText='font-size:11px;font-weight:900;color:#a04c88;margin-bottom:5px';cap.textContent='🏆 SECRET ACHIEVEMENTS UNLOCKED';badgeBox.appendChild(cap);const names={piyush:'😂 Piyush Punisher',bua:'💥 Bua Buster',combo5:'🔨 Drama Destroyer',combo15:'👑 Krati the Unstoppable',hammer:'🔥 Super Hammer',rex:'🦖 Overthinking Slayer'};for(const id of achievements){const d=document.createElement('span');d.className='badge-pill';d.textContent=names[id]||id;badgeBox.appendChild(d)}}else badgeBox.style.display='none';sleepBox.style.display='block';confetti();sound(560);setTimeout(()=>sound(720),150)}
function begin(){clearInterval(tick);clearInterval(spawn);clearTimeout(finalTimer);score=0;combo=0;time=60;boss=false;bossHits=0;lastHit=0;running=true;superUntil=0;superUsed=false;piyushHits=0;buaHits=0;achievements.clear();bossDefeated=false;lastApology=-1;field.innerHTML='';overlay.style.display='none';badgeBox.style.display='none';sleepBox.style.display='none';root.querySelectorAll('.confetti').forEach(x=>x.remove());stats();for(let i=0;i<4;i++)spawnTarget();spawn=setInterval(spawnTarget,850);tick=setInterval(()=>{if(!running)return;time--;stats();if(time===15&&!boss)showBoss();if(time<=0)end()},1000)}start.addEventListener('click',begin);
})();
</script></body></html>
